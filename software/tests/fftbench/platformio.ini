; fftbench: the cost of CMSIS-DSP's real FFT on the Teensy 4.1 (see src/main.cpp)
;   pio run -e rev2 -t upload, then read the serial port (any line repeats it)
; A plain sketch at the firmware's clock; the upload guard keeps it off the
; wrong unit.

[platformio]
default_envs = rev2

[env]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-gui
board_build.f_cpu = 816000000L
extra_scripts =
    pre:../../firmware/upload_guard.py

[env:rev1]
build_flags = -D NEMESIS_HW_REV=1

[env:rev2]
build_flags = -D NEMESIS_HW_REV=2
