; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Build for one hardware revision only, the pins differ between them:
;   pio run -e rev2 -t upload
;   pio run -e rev1 -t upload

[platformio]
default_envs = rev2

[env]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
board_build.f_cpu = 816000000L
lib_deps =
    symlink://../../lib/nemesis
lib_ldf_mode = chain+
extra_scripts =
    pre:../../faust/faust_build.py
build_flags =
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    ; the Teensy macro for the block size is AUDIO_BLOCK_SAMPLES (default 128),
    ; the AUDIO_BLOCK_SIZE=16 used before had no effect
    ;-D AUDIO_BLOCK_SAMPLES=16
custom_faust_options = -double

[env:rev1]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=1

[env:rev2]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=2
