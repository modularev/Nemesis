; NEMESIS firmware with several programs, chosen with the encoder (rev2).
;
; Add or remove programs in custom_faust_programs (or drop .dsp files into
; src/), then build and upload:
;   pio run -e rev2 -t upload
;
; USB type MIDI + Serial: the module shows up as a USB MIDI device, MIDI
; programs also listen to the MIDI jack.

[platformio]
default_envs = rev2

[env]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-gui
; mooSpace alone needs ~80 % at 600 MHz and 48 kHz
board_build.f_cpu = 816000000L
lib_deps =
    symlink://../lib/nemesis
lib_ldf_mode = chain+
extra_scripts =
    pre:../faust/faust_build.py
    pre:upload_guard.py
build_unflags = -D USB_SERIAL
build_flags =
    -D USB_MIDI_SERIAL
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    ; sqrtf/lrintf as FPU instructions instead of libm calls: per sample they
    ; went through flash veneers, whose cache lines collide with a program's
    ; loop depending on where the code lands (pollen 59 -> 80 % after the
    ; spectral library moved code, 2026-11-20; mooSpace2 fmodf, 2026-11-17)
    -fno-math-errno
custom_faust_programs =
    ../programs/juno.dsp
    ../programs/mooSpace.dsp
    ../programs/mooSpace2.dsp
    ../programs/freqshift.dsp
    ../programs/superosc.dsp
    ../programs/breaker.dsp
    ../programs/growler.dsp
    ../programs/pollen.dsp
    ../programs/strike.dsp
    ../programs/bitrot.dsp
    ../programs/primetime.dsp
    ../programs/harmonizer.dsp
    ../programs/slush.dsp
board_build.ldscript = ../lib/nemesis/teensy41_flash.ld
; delays longer than 16384 samples get their exact length instead of the next
; power of two (less memory, so more fits in fast RAM; a compare instead of a
; mask when reading them, ~0.25 % CPU in mooSpace2); -mcd 0: short delays as
; ring buffers instead of shifting copies, 1-4 points less CPU in most
; programs on rev2 (FAUST 2.94.1, 2026-11-19)
custom_faust_options = -dlt 16384 -mcd 0

[env:rev1]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=1

[env:rev2]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=2

