; NEMESIS firmware with several programs, chosen with the encoder (rev2).
;
; Add or remove programs in custom_faust_programs (or drop .dsp files into
; src/), then build and upload:
;   pio run -e rev2 -t upload
;
; USB type MIDI + Serial: the module shows up as a USB MIDI device, MIDI
; programs also listen to the MIDI jack.

[platformio]
default_envs = rev2

[env]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-gui
; mooSpace alone needs ~80 % at 600 MHz and 48 kHz
board_build.f_cpu = 816000000L
lib_deps =
    symlink://../lib/nemesis
lib_ldf_mode = chain+
extra_scripts =
    pre:../faust/faust_build.py
build_unflags = -D USB_SERIAL
build_flags =
    -D USB_MIDI_SERIAL
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
custom_faust_programs =
    ../programs/juno.dsp
    ../programs/mooSpace.dsp
    ../programs/freqshift.dsp
    ../programs/superosc.dsp
    ../programs/breaker.dsp
board_build.ldscript = ../lib/nemesis/teensy41_flash.ld

[env:rev1]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=1

[env:rev2]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=2
