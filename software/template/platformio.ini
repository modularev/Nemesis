; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Build for one hardware revision only, the pins differ between them:
;   pio run -e rev2 -t upload
;   pio run -e rev1 -t upload
;
; Copied outside this repository? Point lib_deps, extra_scripts and
; custom_faust_arch to software/lib/nemesis and software/faust.

[platformio]
default_envs = rev2

[env]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-gui
lib_deps =
    symlink://../lib/nemesis
lib_ldf_mode = chain+
extra_scripts =
    pre:../faust/faust_build.py
build_flags =
    ;-D NEMESIS_AUDIO_MEMORY=4
    ;-D AUDIO_SAMPLE_RATE_EXACT=48000.0f
custom_faust_options =
;custom_faust = /path/to/faust
;custom_faust_arch = ../faust

[env:rev1]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=1

[env:rev2]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=2
