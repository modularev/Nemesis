; NEMESIS firmware with a single program from ../programs, for rev1 (no
; display or encoder to choose a program) or to try one program on rev2.
;
; Choose the program in custom_faust_programs, then build and upload:
;   pio run -e rev1 -t upload
;   pio run -e rev2 -t upload

[platformio]
default_envs = rev2

[env]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-gui
board_build.f_cpu = 816000000L
lib_deps =
    symlink://../lib/nemesis
lib_ldf_mode = chain+
extra_scripts =
    pre:../faust/faust_build.py
build_unflags = -D USB_SERIAL
build_flags =
    -D USB_MIDI_SERIAL
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
custom_faust_programs =
    ../programs/mooSpace.dsp

[env:rev1]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=1

[env:rev2]
build_flags = ${env.build_flags} -D NEMESIS_HW_REV=2
